<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GymPlanner — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">GymPlanner Admin</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExampleDefault">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarsExampleDefault">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" id="auth-link" href="#">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <h2>Admin Panel</h2>

  <div class="row">
    <div class="col-md-6">
      <h4>Users</h4>
      <div id="users-table"></div>
    </div>

    <div class="col-md-6">
      <h4>Analytics</h4>
      <canvas id="chart-signups" height="200"></canvas>
    </div>
  </div>

  <hr class="my-4">

  <h3>Database Seeder</h3>
  <p class="text-muted">Click below to insert default exercises into Firestore.</p>
  <button id="seedBtn" class="btn btn-warning">Seed Starter Exercises</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script src="js/firestore.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script src="js/seed.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
